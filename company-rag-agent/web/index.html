<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Flow Assistant</title>
<style>
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --text:#1b1f24; --muted:#636c76; --line:#e1e4e8;
    --accent:#2f6fed; --accent-soft:#eaf1fe; --user:#2f6fed; --tool:#8250df; --tool-soft:#f3eefc;
    --ok:#1a7f37; --err:#cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a20; --text:#e6e8eb; --muted:#9aa2ad; --line:#2a2f37;
            --accent-soft:#1c2a45; --tool-soft:#2a2140; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,"Segoe UI",Vazirmatn,Tahoma,sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header .logo { width:32px; height:32px; border-radius:8px; background:var(--accent); color:#fff;
                 display:grid; place-items:center; font-weight:700; }
  header h1 { font-size:16px; margin:0; }
  header .status { margin-left:auto; font-size:12.5px; color:var(--muted); }
  header button { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:8px;
                  padding:6px 10px; font:inherit; font-size:13px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:20px 16px; }
  .wrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:88%; padding:11px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot.err { border-color:var(--err); }
  .ref { background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:0 4px; font-size:12px; font-weight:600; }
  .meta { margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted); white-space:normal; }
  .chip { display:inline-block; margin:3px 4px 0 0; padding:2px 8px; border-radius:999px; font-size:12px;
          background:var(--accent-soft); color:var(--accent); }
  .chip.tool { background:var(--tool-soft); color:var(--tool); }
  details { margin-top:6px; } summary { cursor:pointer; }
  pre { font-size:11.5px; background:var(--bg); padding:8px; border-radius:6px; overflow-x:auto; white-space:pre-wrap; }
  .examples { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
  .examples button { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px;
                     padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .examples button:hover { border-color:var(--accent); }
  .empty { text-align:center; color:var(--muted); margin-top:8vh; }
  .empty h2 { color:var(--text); font-size:20px; margin-bottom:4px; }
  form { display:flex; gap:10px; padding:14px 16px; background:var(--panel); border-top:1px solid var(--line); }
  form .inner { max-width:820px; margin:0 auto; display:flex; gap:10px; width:100%; }
  textarea { flex:1; resize:none; height:46px; max-height:160px; padding:12px 14px; border:1px solid var(--line);
             border-radius:10px; font:inherit; background:var(--bg); color:var(--text); }
  textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
  form button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:wait; }
  .typing { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <h1>Nimbus Flow Assistant</h1>
  <span class="status" id="status">checking…</span>
  <button id="reset" title="Start a new conversation">New chat</button>
</header>

<div id="log"><div class="wrap" id="wrap">
  <div class="empty" id="empty">
    <h2>Ask about company policies or a customer</h2>
    <div>Answers come from internal documents and the CRM, with sources.</div>
    <div class="examples">
      <button>How much does the Business plan cost and what does it include?</button>
      <button>Can a customer get a refund on an annual plan after 3 weeks?</button>
      <button>What plan is Acme GmbH on and do they have open tickets?</button>
      <button>Karimi Shop has a P1 issue. How fast must we respond?</button>
      <button>Which customers are past due?</button>
      <button>داده‌های مشتریان کجا ذخیره می‌شوند؟</button>
    </div>
  </div>
</div></div>

<form id="f">
  <div class="inner">
    <textarea id="q" dir="auto" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)" required></textarea>
    <button id="send">Send</button>
  </div>
</form>

<script>
const wrap = document.getElementById('wrap'), log = document.getElementById('log');
const q = document.getElementById('q'), send = document.getElementById('send');
let sessionId = null;

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scroll = () => log.scrollTop = log.scrollHeight;

function add(cls, html) {
  document.getElementById('empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.dir = 'auto'; d.innerHTML = html;
  wrap.appendChild(d); scroll(); return d;
}

function render(r) {
  let html = esc(r.answer).replace(/\[(S\d+)\]/g, '<span class="ref">$1</span>')
                          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const meta = [];
  if (r.sources?.length) meta.push('<div>' + r.sources.map(s =>
      `<span class="chip" title="score ${s.score}">${s.ref} · ${esc(s.source)}${s.section ? ' § ' + esc(s.section) : ''}</span>`).join('') + '</div>');
  if (r.tool_calls?.length) meta.push('<div>' + r.tool_calls.map(t =>
      `<span class="chip tool">${t.ok ? '⚙' : '⚠'} ${esc(t.tool)}(${esc(JSON.stringify(t.arguments))})</span>`).join('') + '</div>');
  meta.push(`<details><summary>${r.steps} step(s) · ${(r.latency_ms/1000).toFixed(1)} s</summary><pre>${esc(JSON.stringify(r.tool_calls, null, 2))}</pre></details>`);
  return html + '<div class="meta" dir="ltr">' + meta.join('') + '</div>';
}

async function ask(text) {
  add('user', esc(text));
  const pending = add('bot typing', 'Thinking…');
  send.disabled = true;
  try {
    const res = await fetch('/ask', { method:'POST', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify({ question:text, session_id:sessionId }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.detail || res.status);
    sessionId = r.session_id;
    pending.className = 'msg bot' + (r.error ? ' err' : '');
    pending.innerHTML = render(r);
  } catch (e) {
    pending.className = 'msg bot err';
    pending.textContent = 'Error: ' + e.message;
  } finally { send.disabled = false; scroll(); q.focus(); }
}

document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault(); const t = q.value.trim(); if (!t) return; q.value = ''; ask(t);
});
q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); } });
document.querySelectorAll('.examples button').forEach(b => b.onclick = () => ask(b.textContent));
document.getElementById('reset').onclick = () => {
  if (sessionId) fetch('/sessions/' + sessionId, { method:'DELETE' });
  sessionId = null; wrap.innerHTML = ''; location.reload();
};
fetch('/health').then(r => r.json()).then(h => {
  document.getElementById('status').textContent = h.status === 'ok'
    ? `${h.chat_model} · ${h.documents} docs · ${h.chunks} chunks` : 'index missing — run ingest';
}).catch(() => document.getElementById('status').textContent = 'offline');
</script>
</body>
</html>
